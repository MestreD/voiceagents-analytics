version: 2

sources:
  - name: raw
    description: >
      Raw extracts as they land from the application database and the billing
      system. Generated locally by scripts/generate_data.py, so the files are
      not committed; run the script after cloning.
    meta:
      external_location: "read_csv_auto('data/raw/{name}.csv')"

    tables:
      - name: gestorias
        description: One row per customer firm. Current state only, no history.
        columns:
          - name: gestoria_id
            description: Primary key.
            data_tests:
              - unique
              - not_null
          - name: plan_code
            description: Subscription plan the firm is on today.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["basico", "pro", "premium"]

      - name: pricing
        description: >
          One row per plan per validity window. valid_from is inclusive and
          valid_to is exclusive; the current row has a null valid_to. Billing a
          month means picking the row in force on that month's last day.
        columns:
          - name: plan_code
            data_tests:
              - not_null
          - name: valid_from
            data_tests:
              - not_null

      - name: calls
        description: One row per call handled by the voice agent.
        columns:
          - name: call_id
            description: Primary key.
            data_tests:
              - unique
              - not_null
          - name: gestoria_id
            description: The firm whose line the call came in on.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'gestorias')
                    field: gestoria_id
          - name: started_at
            data_tests:
              - not_null
